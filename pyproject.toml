[project]
name = "cloudmail-token-broker"
version = "0.3.0"
description = "Multi-instance CloudMail mailbox gateway and admin console"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43,<47",
    "faker>=40,<41",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["test"]
