services:
  cloudmail-token-broker:
    image: ${IMAGE_NAME:?please set IMAGE_NAME in .env}
    pull_policy: always
    container_name: cloudmail-token-broker
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8788:8080"
      - "110:8110"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import json, socket, urllib.request;
          body=json.load(urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3));
          assert body.get('pop3Enabled') is False or body.get('pop3Listening') is True;
          socket.create_connection(('127.0.0.1', 8110), timeout=3).close() if body.get('pop3Enabled') else None"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
